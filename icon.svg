<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smart Focus Hub icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Rounded background (safe for maskable icons: keep content inside ~80% safe zone) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Decorative outer ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="20"/>

  <!-- Progress arc (3/4 ring) -->
  <circle cx="256" cy="256" r="168"
          fill="none"
          stroke="url(#ring)"
          stroke-width="20"
          stroke-linecap="round"
          stroke-dasharray="791 1055"
          transform="rotate(-90 256 256)"/>

  <!-- Center bullseye -->
  <circle cx="256" cy="256" r="78" fill="#ffffff"/>
  <circle cx="256" cy="256" r="42" fill="#6366f1"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
</svg>
